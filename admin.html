
<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>ADMIN PANEL</h2>
        <nav>
            <a href="index.html">View Website</a>
        </nav>
    </header>

    <!-- Login Form -->
    <div class="admin-box" id="loginBox">
        <h2>Admin Login</h2>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button onclick="login()">Login</button>

        <p id="loginMessage" class="message"></p>
    </div>

    <!-- Dashboard -->
    <div class="admin-box" id="dashboard" style="display:none;">

        <h2>Edit Portfolio</h2>

        <label>Your Name</label>
        <input type="text" id="nameInput">

        <label>Your Role</label>
        <input type="text" id="roleInput">

        <label>About Me</label>
        <textarea id="aboutInput" rows="4"></textarea>

        <label>Email</label>
        <input type="email" id="emailInput">

        <label>Skills (separate with commas)</label>
        <input type="text" id="skillsInput">

        <label>Project 1 Title</label>
        <input type="text" id="project1Title">

        <label>Project 1 Description</label>
        <textarea id="project1Description"></textarea>

        <label>Project 2 Title</label>
        <input type="text" id="project2Title">

        <label>Project 2 Description</label>
        <textarea id="project2Description"></textarea>

        <button onclick="saveData()">Save Changes</button>
        <button onclick="logout()">Logout</button>

        <p id="saveMessage" class="message"></p>
    </div>
<script src="admin.js"></script>

</body>
</html>
