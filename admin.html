
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | HAMAYAL Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

    <!-- Login Form -->
    <div class="admin-box" id="loginBox">
        <h1>Admin Login</h1>
        <p>Login to manage your portfolio.</p>

        <form id="loginForm">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage" class="admin-message"></p>

        <a href="index.html">← Back to Portfolio</a>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-box" id="dashboard" style="display: none;">
        <h1>Portfolio Dashboard</h1>
        <p>Edit your information and save your changes.</p>

        <form id="portfolioForm">

            <label for="nameInput">Full Name</label>
            <input type="text" id="nameInput" required>

            <label for="roleInput">Your Role</label>
            <input type="text" id="roleInput" required>

            <label for="aboutInput">About Me</label>
            <textarea id="aboutInput" required></textarea>

            <label for="emailInput">Email Address</label>
            <input type="email" id="emailInput" required>

            <label for="skillsInput">Skills</label>
            <textarea id="skillsInput" placeholder="HTML, CSS, JavaScript"></textarea>
            <small>Separate each skill with a comma.</small>

            <hr>

            <h2>Project 1</h2>

            <label for="project1Title">Project Title</label>
            <input type="text" id="project1Title" required>

            <label for="project1Description">Project Description</label>
            <textarea id="project1Description" required></textarea>

            <h2>Project 2</h2>

            <label for="project2Title">Project Title</label>
            <input type="text" id="project2Title" required>

            <label for="project2Description">Project Description</label>
            <textarea id="project2Description" required></textarea>

            <h2>Project 3</h2>

            <label for="project3Title">Project Title</label>
            <input type="text" id="project3Title" required>

            <label for="project3Description">Project Description</label>
            <textarea id="project3Description" required></textarea>

            <button type="submit">Save Changes</button>
            <button type="button" id="logoutButton">Logout</button>
        </form>

        <p id="saveMessage" class="admin-message"></p>

        <a href="index.html">View Portfolio</a>
    </div>

    <script src="admin.js"></script>
</body>
</html>
